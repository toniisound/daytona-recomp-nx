name: Build
# The tools and tests, built the way setup builds them, on Linux (GCC and
# Clang): the host the Switch port is built from. No ROM set: the game itself
# is not recompiled here.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-gcc, os: ubuntu-24.04}
          - {name: linux-clang, os: ubuntu-24.04, cc: clang, cxx: clang++}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup (Linux, setup.sh with its apt packages)
        if: runner.os == 'Linux'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: ./setup.sh
      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure
